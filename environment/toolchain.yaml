dependency_chain:
  - component: "official_multimodal_demo"
    requires:
      - "Orange Pi 5 Pro device tree and bootable vendor kernel"
      - "RKNPU >=0.9.8"
      - "version-matched application-private RKNN runtime"
      - "RKLLM runtime 1.3.0"
      - "official Qwen3-VL-2B RKNN and RKLLM artifacts"
    status: "blocked"
    blocked_by: "No verified Orange Pi 5 Pro RKNPU >=0.9.8 boot baseline"
  - component: "realsense_capture"
    requires:
      - "D455 at 5000M"
      - "librealsense with RSUSB backend"
      - "project-private installation prefix"
    status: "planned"
  - component: "offline_agent"
    requires:
      - "official_multimodal_demo accepted"
      - "realsense_capture accepted"
      - "serialized NPU scheduling"
    status: "blocked"
    blocked_by: "Upstream milestones are incomplete"

