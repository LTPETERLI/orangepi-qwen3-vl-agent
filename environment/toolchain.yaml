  - "replace system librknnrt.so"
  - "replace system librkllmrt.so"
  - "install a generic kernel"
  - "install a 5B or 5 Plus kernel package on Orange Pi 5 Pro"
  - "update D455 firmware"
  - "merge environment work into main"
