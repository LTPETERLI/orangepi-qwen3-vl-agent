    - "dependency installation or removal"
    - "toolchain version change"
    - "runtime, driver, kernel, model, or firmware change"
    - "artifact download or replacement"
    - "validation status change"
  artifact_fields:
    - "source"
    - "version"
    - "target"
    - "size_bytes"
    - "sha256"
    - "status"
  allowed_statuses:
    - "verified"
    - "present_unverified"
    - "planned"
    - "blocked"
    - "rejected"

